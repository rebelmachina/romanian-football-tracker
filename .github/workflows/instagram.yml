name: Instagram post
# After each Pages deploy, post finished days' story + feed post to Instagram.
# The post job uses the "instagram" environment, which needs a reviewer's
# approval and holds the IG_TOKEN / IG_USER_ID secrets.
on:
  workflow_run:
    workflows: ["Deploy Pages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      days:
        description: "YYYY-MM-DD days to post, space separated (default: pending days)"
        required: false

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      days: ${{ steps.pending.outputs.days }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - id: pending
        working-directory: scraper
        env:
          DAYS: ${{ inputs.days }}
        run: |
          if [ -n "$DAYS" ]; then
            echo "$DAYS" | grep -Eqx '([0-9]{4}-[0-9]{2}-[0-9]{2} ?)+' || { echo "bad days: $DAYS"; exit 1; }
            echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          else python ig_post.py --check >> "$GITHUB_OUTPUT"; fi
          cat "$GITHUB_OUTPUT"
      - name: Captions to approve
        if: steps.pending.outputs.days != ''
        working-directory: scraper
        run: |
          {
            echo '## Instagram: ${{ steps.pending.outputs.days }}'
            echo '```'
            python ig_post.py --post ${{ steps.pending.outputs.days }} --dry-run
            echo '```'
            for d in ${{ steps.pending.outputs.days }}; do
              echo "![story](https://rebelmachina.github.io/romanian-football-tracker/stories/$d.jpg) ![post](https://rebelmachina.github.io/romanian-football-tracker/stories/$d-post.jpg)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  post:
    needs: check
    if: needs.check.outputs.days != ''
    runs-on: ubuntu-latest
    environment: instagram
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Publish
        working-directory: scraper
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python ig_post.py --post ${{ needs.check.outputs.days }}
      - name: Commit post log
        if: always()      # keep what did go up, even if a later post failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper/ig_posted.json
          git diff --staged --quiet && exit 0
          git commit -m "data: instagram posts ${{ needs.check.outputs.days }}"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
