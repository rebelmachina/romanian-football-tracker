name: Daily scrape
on:
  schedule:
    - cron: "0 6 * * *"     # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history to scrape (blank = players.yaml default; e.g. 3 or 0.5)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330       # allow long one-off backfills
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scraper/requirements.txt
      - name: Scrape
        working-directory: scraper
        env:
          YEARS: ${{ inputs.years }}
        run: |
          if [[ "$YEARS" =~ ^[0-9.]+$ ]]; then
            python scrape.py --years "$YEARS"
          else
            python scrape.py
          fi
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data.json scraper/cache.json scraper/incidents_cache.json
          git diff --staged --quiet || git commit -m "data: daily update $(date -u +%FT%TZ)"
          git push
