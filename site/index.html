<!doctype html>
<html lang="ro">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jucători Români în Lume</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="flag" aria-hidden="true">🇷🇴</span>
      <div>
        <h1>Jucători Români în Lume</h1>
        <p class="tagline" id="summary">Se încarcă…</p>
      </div>
    </div>
    <div class="controls">
      <input id="filter" type="search" placeholder="Caută jucător sau echipă…" autocomplete="off">
      <button id="refresh" title="Reîncarcă linkurile YouTube">↻ Highlights</button>
      <span class="updated" id="updated"></span>
    </div>
  </header>

  <main id="app">
    <p class="loading">Se încarcă datele…</p>
  </main>

  <footer class="foot">
    <span>Date de pe Flashscore · actualizat zilnic</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
